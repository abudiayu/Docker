<style>
:root{--bg:#f6f1e7;--panel:#fbf8f1;--line:#e7e0d1;--ink:#1b1a17;--muted:#6d685d;--sage:#4d5a3d;--sage-ink:#fff;--sage-tint:#e9ebdc;--chip:#efeadd;--shadow:60,48,28;--ease:cubic-bezier(.22,.8,.24,1);--serif:"Newsreader","Iowan Old Style",Georgia,serif;--sans:"Nunito Sans","Segoe UI",system-ui,sans-serif}
.hero[data-light=dusk]{--bg:#14170f;--panel:#1b1f15;--line:#2d3324;--ink:#f2ecdf;--muted:#a8a392;--sage:#a9b98a;--sage-ink:#14170f;--sage-tint:#283020;--chip:#262b1d;--shadow:0,0,0}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{overflow:hidden;-webkit-font-smoothing:antialiased;background:var(--bg);font-family:var(--sans);transition:background .6s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .3s}
.hero{position:relative;height:100vh;height:100dvh;overflow:hidden;display:grid;grid-template-columns:196px minmax(0,1fr) clamp(300px,27vw,356px);background:var(--bg);color:var(--ink);transition:background .6s,color .6s}
#gl{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
aside,.info,.tabs,.topbar,.card{transition:opacity .5s var(--ease),transform .5s var(--ease)}
aside{display:flex;flex-direction:column;padding:22px 12px 18px 24px;border-right:1px solid var(--line);min-height:0}
.brand{font:400 26px var(--serif);letter-spacing:-.01em}
nav{margin:20px 0 12px;display:grid;gap:2px}
nav button{display:flex;align-items:center;gap:16px;padding:7px 10px;border-radius:10px;font-size:14.5px}
nav button:hover{background:var(--chip)}nav button[aria-current]{background:var(--sage-tint)}
nav small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.fc{margin-top:auto;background:var(--sage-tint);border-radius:10px;padding:14px 14px 16px}
.eb{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fc img{display:block;width:92px;height:76px;object-fit:contain;margin:10px auto}
.fc h3{font:400 18px var(--serif)}.fc p{font-size:12px;color:var(--muted);line-height:1.4;margin:6px 0 10px}
.fc a{font-size:12px;text-decoration:underline;display:inline-flex;align-items:center;gap:5px;cursor:pointer}.fc a .i{width:13px;height:13px}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);padding:48px 18px 14px 26px;min-width:0}
.tabs{display:flex;gap:10px}
.tab{width:130px;padding:8px 8px 11px;display:grid;justify-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;text-align:center;transition:transform .2s,background .3s,border-color .3s}
.tab:hover{transform:translateY(-2px)}.tab[aria-selected=true]{background:var(--sage-tint);border-color:color-mix(in srgb,var(--sage) 45%,transparent)}
.tab img{width:58px;height:52px;object-fit:contain}.tab span{display:grid;justify-items:center}
.tab b{font:400 15.5px var(--serif)}.tab i{font:italic 400 12.5px var(--serif);color:var(--muted)}
#stage{position:relative;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;min-height:0}#stage.drag{cursor:grabbing}
.gs{position:absolute;left:50%;bottom:15%;width:min(62%,460px);height:44px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(var(--shadow),.22),transparent);transition:opacity .4s,transform .4s}
#stage.sw .gs{opacity:0;transform:translateX(-50%) scaleX(.4)}
.ld{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;font-size:12.5px;color:var(--muted);opacity:0;transition:opacity .3s;pointer-events:none}.ld.on{opacity:1}
.ld:before{content:"";width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);border-top-color:var(--sage);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.fb{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);max-width:60%;max-height:60%;display:none}.fb.on{display:block}
.hint{position:absolute;top:0;right:0;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);transition:opacity .6s}.hint .i{width:16px;height:16px}.hint.off{opacity:0}
.rail{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:6;display:grid;gap:9px}
.rail button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);transition:transform .15s,border-color .2s,background .2s}
.rail button .i{width:17px;height:17px}.rail button:hover{border-color:var(--sage)}.rail button:active{transform:scale(.92)}
.rail button.on{background:var(--sage);color:var(--sage-ink)}
.pill{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 6px;font-size:13px}
.pill button{display:grid;place-items:center;padding:4px 6px;border-radius:999px}.pill .i{width:18px;height:18px}
.cap{position:absolute;bottom:0;left:0;right:0;text-align:center;font:italic 400 clamp(16px,1.55vw,20px) var(--serif)}
.info{display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px;padding:13px 26px 14px 0;min-width:0}
.topbar{display:flex;align-items:center;gap:8px}.topbar .brand{display:none}
.search{flex:1;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.search .i{width:15px;height:15px;color:var(--muted)}.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:11.5px;color:var(--ink);outline:0}
.ib{width:32px;height:32px;display:grid;place-items:center;border-radius:50%}.ib .i{width:18px}
.av{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}.av .i{width:14px;height:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 20px 16px;overflow-y:auto;scrollbar-width:thin;display:flex;flex-direction:column;min-height:0}
#art{flex:1;display:flex;flex-direction:column}
h1{font:500 clamp(40px,4.2vw,54px)/1 var(--serif);letter-spacing:-.025em;margin-top:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}.tags span{font-size:11.5px;padding:6px 13px;border-radius:999px;background:var(--chip)}
.desc{font-size:13.5px;line-height:1.55;text-wrap:pretty;margin-top:14px}
h2{font:400 21px var(--serif);border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.tr{display:grid;grid-template-columns:22px 88px 1fr;gap:16px;font-size:13px;margin-top:11px;align-items:center}.tr .i{width:20px}.tr em{font-style:normal;color:var(--muted)}
.close{margin-top:auto;display:grid;grid-template-columns:76px 1fr 18px;gap:14px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;transition:border-color .2s,background .2s}
.close:hover,.close[aria-pressed=true]{border-color:var(--sage);background:var(--sage-tint)}.close[aria-pressed=true] .i{transform:rotate(180deg)}
.close>span:last-of-type{display:grid;gap:3px}.close b{font:400 18px var(--serif)}.close small{font-size:11.5px;color:var(--muted)}
.lens{width:76px;height:76px;border-radius:50%;background-size:520%;background-color:var(--chip);border:1px solid var(--line)}.close .i{width:18px;height:18px}
.hero.focus aside{opacity:0;transform:translateX(-24px);pointer-events:none}
.hero.focus .info{opacity:0;transform:translateX(24px);pointer-events:none}
.hero.focus .tabs{opacity:0;transform:translateY(-16px);pointer-events:none}
@media(max-height:620px){aside{padding-top:12px}.main{padding-top:20px}.fc img,.fc p{display:none}}
@media(max-width:1100px){.hero{grid-template-columns:minmax(0,1fr) clamp(280px,36vw,340px)}aside{display:none}.main{padding-left:20px}}
@media(max-width:760px){
.hero{display:flex;flex-direction:column}.info{display:contents}.hero.focus .info{opacity:1;transform:none}
.topbar{order:0;padding:10px 14px 0}.topbar .brand{display:block;flex:1;font-size:21px}
.search{flex:none;width:32px;padding:0;justify-content:center;border-radius:50%}.search input{display:none}
.main{order:1;flex:1;padding:10px 14px 6px;min-height:0}
.tabs{gap:8px}.tab{flex:1;width:auto;grid-template-columns:44px 1fr;gap:8px;padding:6px 10px;text-align:left;align-items:center;justify-items:start}
.tab img{width:44px;height:40px}.tab span{justify-items:start}.tab b{font-size:15px}.tab i{font-size:12px}
.rail{gap:7px}.rail button{width:34px;height:34px}.pill{bottom:30px}.cap{font-size:15px}.hint{display:none}.gs{bottom:17%;height:30px}
.card{order:2;position:absolute;left:0;right:0;bottom:0;z-index:7;max-height:40dvh;border-radius:16px 16px 0 0;border-width:1px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
h1{font-size:34px}h2{font-size:19px}
.hero.focus .card{transform:translateY(110%)}.hero.focus .topbar{opacity:0;pointer-events:none}}
@media(prefers-reduced-motion:reduce){*,*:before{animation-duration:.001s!important;transition-duration:.001s!important}}

/* input */
const ptr=new Map();let pd=0;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;stage.setPointerCapture(e.pointerId);ptr.set(e.pointerId,e);homing=false;vx=vy=0;touch();

$('#tabs').addEventListener('keydown',e=>{const d=e.key=='ArrowRight'?1:e.key=='ArrowLeft'?-1:0;if(!d)return;const i=clamp(idx+d,0,B.length-1);go(i);tabs[i].focus()});
function go(i){if(i==idx||tr)return;const o=idx,dir=Math.sign(i-o);idx=i;sel();swap(i);ensure(i);zoomT=1;homing=false;rigs[i].spin.quaternion.copy(HOME);vx=vy=0;queue=0;touch();

const keyD=new T.Color('#ffc98a'),keyN=new T.Color('#fff4e2'),ease=(t)=>1-Math.pow(1-t,3);let prev=performance.now();

  if(tr){const p=clamp((now-tr.t0)/780,0,1);
   if(k==tr.o){vis=true;const e=Math.pow(clamp(p/.6,0,1),3);sc=1-e;x=-tr.dir*e*slide;yaw=-tr.dir*e*1.4;if(sc<=0)vis=false}
   else if(k==tr.i){const e=ease(p),q=p-1,ob=1+2.2*q*q*q+1.2*q*q;sc=ob*(.25+.75*e);x=tr.dir*(1-e)*slide;yaw=tr.dir*(1-e)*1.6}}
  g.pivot.visible=vis&&g.ok;g.pivot.scale.setScalar(Math.max(sc,.0001));
  const on=k==idx;g.pivot.position.set(x,RM?0:Math.sin(sec*1.3+k)*.028,0);
  g.pivot.rotation.set(on?Math.sin(sec*.9)*.03*idle:0,yaw+(on?Math.sin(sec*.55)*.16*idle:0),0)});
 const lf=1-Math.exp(-dt*4);lightT+=((dusk?1:0)-lightT)*lf;const m=(a,b)=>a+(b-a)*lightT;
 scene.environmentIntensity=m(.95,.28);key.intensity=m(1.6,2.6);rim.intensity=m(.5,1.9);R.toneMappingExposure=m(1.05,1);key.color.copy(keyN).lerp(keyD,lightT);
 cam.position.z=H/(2*Math.tan(FOV*Math.PI/360)*px*zoom);cam.setViewOffset(W,H,W/2-cx,H/2-cy,W,H);R.render(scene,cam);

 $('#zi').classList.toggle('on',zoomT>=1);$('#zo').classList.toggle('on',zoomT<1);$('#zi').setAttribute('aria-pressed',zoomT>=1);$('#zo').setAttribute('aria-pressed',zoomT<1);
 const cb=art.querySelector('.close');if(cb)cb.setAttribute('aria-pressed',zoomT>2.2)}
$('#fb').src=B[idx].img;tabs.forEach(t=>t.addEventListener('click',()=>$('#fb').src=B[+t.dataset.i].img));
sel();swap(idx,true);requestAnimationFrame(frame);measure();
ensure(idx).then(()=>ensure(1-idx));
